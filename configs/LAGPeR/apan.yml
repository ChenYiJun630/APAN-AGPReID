
MODEL:
  META_ARCHITECTURE: Baseline_multiview_APAN
  PIXEL_MEAN: [127.5, 127.5, 127.5]
  PIXEL_STD: [127.5, 127.5, 127.5]
  USE_SECAP: True

  BACKBONE:
    NAME: build_multiview_vit_backbone_APAN
    DEPTH: base
    FEAT_DIM: 768
    PRETRAIN: True
    PRETRAIN_PATH: jx_vit_base_p16_224-80ecf9dd.pth
    
    STRIDE_SIZE: (12, 12)
    DROP_PATH_RATIO: 0.1
    DROP_RATIO: 0.0
    ATT_DROP_RATE: 0.0
    INNER_SUB: True
    PROMPT_LEN: 64
    PROMPT_DEPTH: 2
    USE_PRM: True
    USE_GATE: False
    TOPK: 16
    DELTA1: 1.6
    DELTA2: 1.5

  HEADS:
    NAME: EmbeddingHead
    NORM: BN
    WITH_BNNECK: True
    POOL_LAYER: Identity
    NECK_FEAT: before
    CLS_LAYER: Linear

  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss","ADMLoss")

    CE:
      EPSILON: 0.
      SCALE: 1.
      # view-related learning
      VIEW_ID: True
      VIEW_OREG: True
      VIEW_LAMBDA: 0.001

    TRI:
      MARGIN: 0.0
      HARD_MINING: True
      NORM_FEAT: False
      SCALE: 1.

    ADM:
      BETA: 1.2
      ALPHA: 0.01


INPUT:
  SIZE_TRAIN: [ 256, 128 ]
  SIZE_TEST: [ 256, 128 ]

  REA:
    ENABLED: True
    PROB: 0.5

  FLIP:
    ENABLED: True

  PADDING:
    ENABLED: True

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  AMP:
    ENABLED: True
  OPT: SGD
  MAX_EPOCH: 120
  BASE_LR: 0.008
  WEIGHT_DECAY: 0.0001
  IMS_PER_BATCH: 128

  SCHED: CosineAnnealingLR
  ETA_MIN_LR: 0.0000016

  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 2000

  CLIP_GRADIENTS:
    ENABLED: True

  CHECKPOINT_PERIOD: 5

TEST:
  EVAL_PERIOD: 1
  IMS_PER_BATCH:  384

CUDNN_BENCHMARK: True

DATASETS:
  NAMES: ("LAGPeR",)
  TESTS: ("LAGPeR_A2G", "LAGPeR_G2A", "LAGPeR_G2AG", )

OUTPUT_DIR: XXX
